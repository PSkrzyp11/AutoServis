name: Backend

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autoservis
          POSTGRES_PASSWORD: autoservis
          POSTGRES_DB: autoservis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autoservis -d autoservis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://autoservis:autoservis@localhost:5432/autoservis_test
      TEST_DATABASE_URL: postgresql+asyncpg://autoservis:autoservis@localhost:5432/autoservis_test
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/15
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.5"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy app alembic tests

      - name: Apply migrations and compare with models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Run tests
        run: uv run pytest --cov --cov-report=term

      - name: Verify the OpenAPI contract is up to date
        run: |
          uv run python -m app.cli export-openapi --output openapi.json
          git diff --exit-code openapi.json
