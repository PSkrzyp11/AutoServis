<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AutoServis{% endblock %}</title>
  </head>
  <body style="margin:0;padding:24px;background-color:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto;background-color:#ffffff;border-radius:8px;">
      <tr>
        <td style="padding:24px 32px;border-bottom:1px solid #e4e4e7;font-size:20px;font-weight:bold;">AutoServis</td>
      </tr>
      <tr>
        <td style="padding:32px;font-size:16px;line-height:1.5;">
          {% block content %}{% endblock %}
        </td>
      </tr>
      <tr>
        <td style="padding:16px 32px;border-top:1px solid #e4e4e7;font-size:12px;color:#71717a;">
          Ta wiadomość została wysłana automatycznie. Prosimy na nią nie odpowiadać.
        </td>
      </tr>
    </table>
  </body>
</html>
