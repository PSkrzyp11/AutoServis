name: autoservis

x-backend-build: &backend-build
  context: ./backend
  target: development

x-backend-environment: &backend-environment
  APP_ENV: local
  LOG_LEVEL: INFO
  LOG_JSON: "false"
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/autoservis_test
  REDIS_URL: redis://redis:6379/0
  TEST_REDIS_URL: redis://redis:6379/15
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  FRONTEND_PASSWORD_RESET_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}/nowe-haslo
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SENTRY_DSN: ${SENTRY_DSN:-}
  DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
  BOOKING_LEAD_TIME_MINUTES: ${BOOKING_LEAD_TIME_MINUTES:-60}
  BOOKING_HORIZON_DAYS: ${BOOKING_HORIZON_DAYS:-60}
  CLIENT_CANCELLATION_DEADLINE_HOURS: ${CLIENT_CANCELLATION_DEADLINE_HOURS:-12}
  APPOINTMENT_REMINDER_HOURS: ${APPOINTMENT_REMINDER_HOURS:-24}
  FORWARDED_ALLOW_IPS: "*"
  WATCHFILES_FORCE_POLLING: "true"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  migrate:
    build: *backend-build
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: *backend-build
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: *backend-build
    command: ["arq", "app.workers.settings.WorkerSettings", "--watch", "app"]
    environment: *backend-environment
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
